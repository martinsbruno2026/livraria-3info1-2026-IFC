[project]
name = "livraria"
version = "1.0.0"
description = "API REST da Livraria"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.3,<6.0",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "drf-spectacular>=0.28,<1.0",
    "django-cors-headers>=4.7,<5.0",
    "django-filter>=25.1,<26.0",
    "Pillow>=11.0,<13.0",
    "python-dotenv>=1.1,<2.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python manage.py runserver"
migrate = "python manage.py makemigrations core && python manage.py migrate"
shellp = "python manage.py shell"
superuser = "python manage.py createsuperuser"
test = "python manage.py test"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
